name: clippy

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - master

jobs:
  Lint:
    runs-on: ubuntu-latest
    if: ${{ github.ref_type != 'tag' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The toolchain comes from rust-toolchain.toml so that CI and a local
      # checkout lint against the identical compiler. `rustup show` installs it
      # and prints the resolved version into the log.
      - name: Install pinned toolchain
        run: rustup show

      # Scoped to this package on purpose: `--all` would also format and lint the
      # crates under vendor/, which we deliberately keep close to upstream.
      - name: Run cargo fmt
        run: cargo fmt -p pinion -- --check

      # The gate: correctness lints and rustc's own warnings fail the build.
      # `pedantic` is allowed here and run separately below — a single
      # invocation cannot both deny warnings and demote pedantic, because
      # `-D warnings` re-promotes anything at warn level no matter where the
      # flags are ordered.
      - name: Run clippy
        run: cargo clippy -p pinion --tests -- -Dclippy::all -D warnings -Aclippy::pedantic

      # Advisory only. Pedantic is opinionated by design and its membership
      # grows every release, so it reports without ever failing the build.
      - name: Run pedantic clippy (advisory)
        continue-on-error: true
        run: cargo clippy -p pinion --tests -- -Wclippy::pedantic
