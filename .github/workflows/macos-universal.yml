on:
  push:
    branches:
      - master
    tags:
      - '*'
  workflow_dispatch:

name: alfred-workflow

permissions:
  contents: write

env:
  RELEASE_COMMIT: ${{ github.ref_type == 'tag' }}
  PINBOARD_TOKEN: ${{ secrets.PINBOARD_TOKEN }}

jobs:
  check_if_tagged:
    name: Check if tagged
    runs-on: macos-latest
    outputs:
      istagged: ${{ steps.master_is_tagged.outputs.tagged }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if commit is tagged
        id: master_is_tagged
        run: |
          value=$(git describe --tags --abbrev=0 --exact-match ${{ github.sha }}) || true
          [ -n "$value" ] && value=1 || value=0
          echo "tagged=$value" >> $GITHUB_OUTPUT

  build_universal:
    name: Build Universal Binary
    runs-on: macos-latest
    needs: check_if_tagged
    if: ${{ needs.check_if_tagged.outputs.istagged == 0 || github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v4

      # Toolchain comes from rust-toolchain.toml — see that file for why.
      # The Apple targets are added here rather than in that file so the Linux
      # lint and test jobs don't download macOS std libraries they never use.
      - name: Install pinned toolchain
        run: |
          rustup show
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Show macOS Version
        run: sw_vers

      - name: Build aarch64-apple-darwin (Debug)
        if: ${{ env.RELEASE_COMMIT != 'true' }}
        run: cargo build --target aarch64-apple-darwin

      - name: Build aarch64-apple-darwin (Release)
        if: ${{ env.RELEASE_COMMIT == 'true' }}
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64-apple-darwin (Debug)
        if: ${{ env.RELEASE_COMMIT != 'true' }}
        run: cargo build --target x86_64-apple-darwin

      - name: Build x86_64-apple-darwin (Release)
        if: ${{ env.RELEASE_COMMIT == 'true' }}
        run: cargo build --release --target x86_64-apple-darwin

      # Only for real releases, and only when the secrets exist — forks and pull
      # requests fall through and produce an unsigned build rather than failing.
      - name: Import Developer ID certificate
        if: ${{ github.ref_type == 'tag' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "No MACOS_CERT_P12 secret; this release will be UNSIGNED." >&2
            exit 0
          fi
          # A throwaway keychain, so nothing is left behind on the runner.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')
          [ -n "$IDENTITY" ] || { echo "cert imported but no Developer ID identity found" >&2; exit 1; }
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Imported: $IDENTITY"

      - name: Stage notary credentials
        if: ${{ github.ref_type == 'tag' }}
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          if [ -z "$NOTARY_KEY_P8" ]; then
            echo "No NOTARY_KEY_P8 secret; this release will NOT be notarised." >&2
            exit 0
          fi
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$RUNNER_TEMP/notary.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER=$NOTARY_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Grow fat, test, and make alfredworkflow
        run: .github/workflows/script.sh

      - name: Remove notary key from the runner
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/notary.p8"

      - name: Upload for release
        if: ${{ github.ref_type == 'tag' }}
        uses: actions/upload-artifact@v4
        with:
          name: workflow-upload
          path: Pinion.alfredworkflow

  release_alfred:
    name: Release Workflow
    runs-on: macos-latest
    needs: build_universal
    if: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workflow-upload
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: Pinion.alfredworkflow
