version: 2
updates:
  # The CI here broke once because macos-11 was retired and actions-rs/* was
  # archived, all of which landed as one dead pipeline rather than as notice.
  # This turns that class of rot into incremental PRs instead.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # rusty-pin and alfred-rs are vendored under vendor/ as path dependencies,
    # so Dependabot will not touch them. See vendor/README.md.
    open-pull-requests-limit: 5
